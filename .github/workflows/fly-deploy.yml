name: Fly Deploy
on:
  push:
    branches: [master]
  release:
    types: [published]
jobs:
  staging:
    runs-on: ubuntu-latest
    concurrency: deploy-staging
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only -a gizztapes2-staging
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
  production:
    runs-on: ubuntu-latest
    concurrency: deploy-production
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only -a gizztapes2
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
